<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <title>Something went wrong — clicksable.</title>
  <style>
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:#f7f5ed;color:#172318;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.card{width:min(100%,680px);padding:clamp(28px,7vw,64px);border:1px solid #d9ded1;border-radius:28px;background:#fffefa;box-shadow:0 24px 70px rgba(23,35,24,.1)}.brand{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border-radius:13px;background:#294719;color:#fff;text-decoration:none;font-size:20px;font-weight:850;letter-spacing:-.065em}.brand span{color:#c8ff00}.eyebrow{margin:48px 0 12px;color:#557924;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(42px,9vw,72px);line-height:.95;letter-spacing:-.075em}.copy{max-width:520px;margin:20px 0 0;color:#5d6659;font-size:17px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:32px}.button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:999px;background:#c8ff00;color:#172318;text-decoration:none;font-weight:800}.link{min-height:48px;display:inline-flex;align-items:center;padding:0 8px;color:#345a1e;text-decoration:none;font-weight:750}small{display:block;margin-top:28px;color:#737c70;font-size:12px;line-height:1.6}@media(max-width:480px){body{padding:16px}.actions{display:grid;grid-template-columns:1fr}.link{justify-content:center}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <a class="brand" href="/">click<span>sable.</span></a>
    <p class="eyebrow">A small detour</p>
    <h1 id="error-title">We couldn’t find that page.</h1>
    <p class="copy" id="error-copy">The link may have changed, or the page may have moved. You can return to the website or try loading this page again.</p>
    <div class="actions"><a class="button" href="/">Back to clicksable.</a><a class="link" href="javascript:location.reload()">Try again ↻</a></div>
    <small>If the problem keeps happening, contact <a href="mailto:hello@clicksable.com">hello@clicksable.com</a>.</small>
  </main>
  <script>
    if(location.pathname.endsWith('/500.html')){document.title='Service unavailable — clicksable.';document.getElementById('error-title').textContent='We hit a temporary problem.';document.getElementById('error-copy').textContent='The page is not responding right now. Please try again in a moment, or return to the website.'}
  </script>
</body>
</html>
